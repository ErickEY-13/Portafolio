<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <title>Erick Ayma — Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Portafolio de Erick Yoel Ayma Choque. Bachiller en Ingeniería de Sistemas y desarrollador Full Stack en Tacna, Perú."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Erick Ayma — Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="APIs RESTful en Laravel y NestJS, interfaces en React, Vue y Angular, y apps móviles en Flutter y React Native."
    />
    <meta property="og:image" content="./og.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Aplica el tema antes del primer pintado para evitar el parpadeo blanco. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
